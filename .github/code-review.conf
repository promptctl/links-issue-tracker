# What this repo adds to the AI reviewer's configuration.
#
# Read at install time by the agent-code-review-setup installer, which joins these onto
# the fleet-wide baseline and renders the result into .github/workflows/code-review.yml.
# Do not edit that workflow directly — it is generated, and reconverged on every install.

# doc-v1-total/inventories/ holds the raw per-subsystem citation dumps the v1 total
# spec's chapters were distilled from — generated evidence corpora of 48KB–446KB per
# file, kept in-tree so chapter claims can be audited against their source citations.
# They are not prose anyone reads linearly, and they exceed what a review worker can
# hold: both attempts to review PR #450 died mid-read on these files without posting
# a single finding. Withholding them is a statement about genre and size, not value.
#
# The exclusion is SCOPED to the inventories, not to doc-v1-total/ or to markdown at
# large. The numbered chapters are ordinary docs-beside-code — short, citation-bearing
# prose whose drift from the source is exactly what a reviewer should catch — and
# design-docs/** stays reviewable because design-doc review in this repo demonstrably
# works (the event-store docs took five productive review rounds).
#
# This is an EXCLUDE and deliberately not a trigger-level paths-ignore. Filtering at
# the trigger creates no workflow run at all, and /address-pr-reviews polls the head
# SHA for one: with no run it cannot tell "nothing to review" from "the workflow is
# uninstalled". An exclude still registers and completes a run, leaving the job's
# conclusion as the one honest answer to "was this reviewed". Inventories changed
# alongside other files are named to the reviewer as withheld rather than silently
# absent.
EXCLUDE_PATTERNS_EXTRA=doc-v1-total/inventories/**
