# The test suite shells out to `claude plugin validate --strict` as the oracle
# for the plugin and marketplace manifests, so the `claude` CLI must be on PATH
# before `go test` in every workflow that runs tests — there a missing oracle
# fails its test instead of skipping it (internal/testoracle). (It is a
# test-only oracle; lit does not run it.) The validator needs no login, so a
# bare install is enough. [LAW:one-source-of-truth] This action is the one home
# of the pinned Claude Code version, and of the Node it runs on: the package
# declares `engines: node >=22`.
name: Install Claude Code
description: Install the pinned claude CLI the test suite uses as an oracle.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Claude Code
      shell: bash
      run: |
        set -euo pipefail
        npm install -g @anthropic-ai/claude-code@2.1.292
        # Claude Code's auto-updater may replace the pinned version mid-run;
        # every later step in the job runs with it off.
        echo "DISABLE_AUTOUPDATER=1" >> "$GITHUB_ENV"
        claude --version
