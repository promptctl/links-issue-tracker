# A scheduled lane whose red runs nobody sees is deletion with extra steps, so
# every scheduled workflow reports a red run here, into this repository's own
# backlog: one urgent bug per alarm label, inside the CI alarm epic, where every
# agent session's `lit next` serves it ahead of normal-priority work. A repeat
# run comments on the open ticket instead of filing a duplicate.
# [LAW:no-silent-failure] [LAW:one-type-per-behavior] Each workflow passes its
# alarm as values; the filing mechanism lives here once.
name: Report to lit
description: File (or extend) an urgent lit bug for a red scheduled run and push it to the remote store.
inputs:
  label:
    description: Alarm label, also the ticket's topic. One open ticket per label collects repeat runs.
    required: true
  title:
    description: Title of the ticket filed when no open ticket carries the label.
    required: true
  body:
    description: What the alarm means and how to triage it; the run URL is prepended.
    required: true
  token:
    description: Token with contents:write, for pushing the store's refs/dolt/data.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: File the alarm in lit and push it
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        TOKEN: ${{ inputs.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The explicit `lit sync push` below is the one push, and it fails this
        # step if its last attempt fails; a background mirror could still be
        # running when the job ends. [LAW:no-silent-failure]
        LIT_DISABLE_AUTO_SYNC: "1"
      run: |
        set -euo pipefail
        # [LAW:one-source-of-truth] The alarm epic's id lives only here; the
        # epic's description points back at this file.
        epic=links-ci-alarm-z6sv
        # Embedded Dolt runs git against its own cache repository, not this
        # checkout, so the credential has to be global; a checkout-local one
        # would never reach the push.
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        lit="$RUNNER_TEMP/lit"
        go build -o "$lit" ./cmd/lit
        # A fresh clone adopts the remote's backlog here (first-receive).
        "$lit" init
        existing=$("$lit" ls --labels "$LABEL" --status open,in_progress --limit 1 --columns id)
        if [ -n "$existing" ]; then
          "$lit" comment add "$existing" --body "Red again: ${RUN_URL}"
        else
          "$lit" new --parent "$epic" --type bug --priority urgent --top \
            --topic "$LABEL" --labels "$LABEL" --title "$TITLE" \
            --description "Red run: ${RUN_URL}

        ${BODY}"
        fi
        # A push is refused when another writer (an agent session, the other
        # scheduled lane) moved refs/dolt/data after `lit init` adopted it; the
        # pull merges that write in and the push goes again. A failure the pull
        # cannot cure fails the last push, and with it this step.
        # [LAW:no-silent-failure]
        for attempt in 1 2; do
          "$lit" sync push && exit 0
          echo "::warning::lit sync push attempt ${attempt} of 3 was refused; pulling the remote and retrying"
          "$lit" sync pull
        done
        "$lit" sync push
