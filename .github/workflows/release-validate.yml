name: Release validate

# Proves the full release pipeline end-to-end: builds the custom release-builder
# image (zig cross-toolchain + ICU cross-builds for every target Lit ships), runs
# goreleaser inside it to produce per-platform archives + checksums, runs
# mkmanifest, and asserts the resulting manifest has every expected platform with
# a valid SHA256.
#
# This runs OUT-OF-BAND, never on pull_request — the full cross-build takes ~35
# minutes, which must never sit on the PR feedback loop. PRs get the fast native
# smoke (release-smoke.yml) instead. The full proof runs post-merge on master
# and on demand via workflow_dispatch.
#
# It is ALSO the release pipeline. When the newest CHANGELOG version has no tag
# yet — a release is pending on this commit — the `validate` job builds the REAL
# version (not a snapshot) and the `publish` job below cuts the tag and publishes
# the validated artifact. Build once, tag + publish from CI: no local tag push,
# no second build. An ordinary master push just runs the snapshot proof.
#
# [LAW:single-enforcer] this workflow owns the *release-level* invariant (do all
# five cross-targets + the manifest assemble?) AND is the single place a release
# is cut; release-smoke.yml owns the fast *code-level* invariant on PRs.
#
# [LAW:verifiable-goals] The acceptance check is a concrete artifact list +
# manifest shape, not "did goreleaser exit 0" — a silent build skip cannot
# pass jq's per-field assertions below. The linux artifacts are additionally
# proven by EXECUTION on both libcs and both arches (glibc runner + Alpine/musl
# containers, arm64 via qemu): the shipped linux binaries are fully static
# musl builds precisely so one binary per arch runs everywhere, and that claim
# is only real if something runs them.

on:
  push:
    branches: [master]
  workflow_dispatch: {}    # on-demand: run the full proof against any branch

permissions:
  contents: read    # image is golang:bookworm + direct downloads (no GHCR pull)
  packages: write   # publish the release-builder `smoke` image to GHCR so PR
                    # gates (release-smoke.yml) pull it instead of rebuilding the
                    # ICU cross-toolchain from source

concurrency:
  # [LAW:no-silent-failure] cancel-in-progress is FALSE on purpose. This workflow
  # is also the release publisher: a pending-release run builds the real artifact,
  # materializes the tag locally, and hands off to publish. Cancelling that mid-run
  # would silently lose the validated artifact + tag and the release would never be
  # cut — with nothing signalling why. A second master push therefore QUEUES behind
  # an in-flight run rather than aborting it. The cost (serialized snapshot gates)
  # is cheap; a silently-dropped release is not.
  group: release-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The publish-blocking license gate (links-supply-chain-w6m9.5). If any
  # component compiled into the release binary — a Go module or a native C
  # library — carries a license outside tools/licenses/policy.json, this job
  # fails, and because `publish` needs it, no tag, archive, or asset is ever
  # published: a non-free build cannot be released, even by accident. This is the
  # last backstop behind the PR-time gate (ci.yml); it lives in the release
  # pipeline so it holds however the release is triggered (push or
  # workflow_dispatch), not only when a PR happened to run first.
  #
  # It runs in PARALLEL with `validate` (the ~35-min cross-build), so a clean
  # tree adds no latency; only `publish` waits on it. CGO_ENABLED=1 is REQUIRED,
  # not cosmetic: `go list -deps ./cmd/lit` resolves a DIFFERENT set with cgo off
  # — measured on linux/amd64, github.com/dolthub/go-icu-regex drops out and the
  # count lands on 153, which is exactly darwin's count, so a cgo-off run looks
  # entirely right while gating a set neither platform links. (gozstd stays
  # either way; an earlier version of this comment named it too and was wrong.)
  # The gate must see the same set the release actually links. It needs no ICU/zstd C
  # toolchain: `go list` resolves imports without compiling them.
  # [LAW:single-enforcer] one predicate (CheckPolicy over policy.json), reused by
  # the PR test and this gate.
  license-gate:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Populate module cache
        run: go mod download
      - name: License-policy gate (publish-blocking)
        run: go run ./tools/licenses -check -pkg ./cmd/lit

  validate:
    runs-on: ubuntu-latest
    # Surfaced to the publish job: whether this commit is a pending release and,
    # if so, which version. [LAW:dataflow-not-control-flow] the publish job's
    # existence is a value this job computed, not a branch it guesses at.
    outputs:
      release: ${{ steps.kind.outputs.release }}
      version: ${{ steps.kind.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One definition of the seeded GOCACHE dir. Everything downstream — the
      # cache step's `path:`, the mkdir, the docker mount, the chown — reads this
      # single value, so the path exists in exactly one place. It lives here (not
      # a job-level `env:`) because the `runner` context is unavailable at job
      # scope: the runner isn't assigned until the job starts.
      # [LAW:one-source-of-truth]
      - name: Resolve the smoke GOCACHE path
        run: echo "SMOKE_GOCACHE=$RUNNER_TEMP/smoke-gocache" >> "$GITHUB_ENV"

      # setup-go RESTORES a module cache keyed on go.sum; it does not run any
      # `go` command, so on a cold cache (first build of a new go.sum) GOMODCACHE
      # is empty. The snapshot build mounts it :ro into the container, where
      # goreleaser cannot then download the missing modules. Populate it here so
      # the read-only mount is correct by construction rather than depending on a
      # warm Actions cache. [LAW:one-source-of-truth] this step is the populated
      # GOMODCACHE; the :ro mount consumes it.
      - name: Populate module cache
        run: go mod download

      # What IS this build — a pending release, or a pipeline-gate snapshot? The
      # discriminator is data, not a flag: the newest released CHANGELOG version
      # that has NO git tag yet is a release pending on THIS commit (the
      # chore(release) promotion just landed; the tag is seconds away). Once its
      # tag exists — or the top section is still [Unreleased] — this is an
      # ordinary master push and we build a snapshot purely to prove the pipeline.
      # [LAW:dataflow-not-control-flow] release-vs-snapshot is a value derived
      # from (CHANGELOG × tags) and carried to the build + upload steps; the same
      # steps run either way. [LAW:one-source-of-truth] the CHANGELOG's newest
      # version is the sole source of the release version — the same string the
      # release tag carries; nothing here invents one.
      - name: Resolve build kind (pending release vs snapshot)
        id: kind
        run: |
          set -euo pipefail
          # The newest release section is the first '## [...]' heading that is not
          # [Unreleased]. Three cases, kept distinct so a typo can't silently skip
          # a release: none (only [Unreleased]) -> snapshot; a well-formed
          # '## [X.Y.Z]' -> release or snapshot by whether its tag exists; a
          # version-ish heading that is MALFORMED -> loud error, never a silent
          # fall-through to snapshot. [LAW:no-silent-failure]
          # [LAW:no-silent-failure] guard the file's existence FIRST, so a broken
          # checkout or a moved/renamed CHANGELOG errors loudly instead of being
          # swallowed by the pipeline's `|| true` and masquerading as "no releases
          # yet". After this guard, `|| true` masks only the benign no-match (grep
          # exit 1); a missing-file (grep exit 2) can no longer reach it.
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md not found at repo root — broken checkout or moved file; refusing to resolve release kind." >&2; exit 1; }
          CAND=$(grep -E '^## \[' CHANGELOG.md | grep -vE '^## \[Unreleased\]' | head -1 || true)
          if [ -z "$CAND" ]; then
            echo "CHANGELOG has no released version yet (only [Unreleased]); snapshot gate."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! echo "$CAND" | grep -qE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]( - .*)?$'; then
            echo "::error::newest CHANGELOG release heading is malformed: '$CAND' (expected '## [X.Y.Z] - <date>')"
            exit 1
          else
            VER=$(echo "$CAND" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            # [LAW:no-silent-failure] `git ls-remote --exit-code` is a three-way
            # signal, not a boolean: 0 = tag present, 2 = no matching ref, anything
            # else (128 network/auth/missing-remote) = a real failure. An `if`
            # collapses 2 AND every error into "no tag" and would flag a spurious
            # release the moment origin is unreachable. Capture the code and branch
            # on the actual value; keep stderr visible so the error is loud.
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null
            r=$?
            set -e
            case "$r" in
              0)
                echo "v$VER is already tagged; ordinary master push; snapshot gate."
                echo "release=false" >> "$GITHUB_OUTPUT"
                ;;
              2)
                echo "v$VER has no tag yet — a release is PENDING on this commit; building the real artifact."
                echo "release=true" >> "$GITHUB_OUTPUT"
                echo "version=$VER" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::git ls-remote failed (exit $r) probing refs/tags/v$VER — cannot determine release state; refusing to guess." >&2
                exit 1
                ;;
            esac
          fi

      # Proven here on every master push so a broken license generator is caught
      # before a tag is cut, and re-used verbatim by the release build below.
      # [LAW:single-enforcer] this workflow is the sole owner of the release build
      # — the same step feeds both the snapshot proof and the publish path.
      #
      # One invocation emits all three compliance artifacts from ONE linked-module
      # inventory: the bundle + report land at the repo root for goreleaser's
      # archives.files to pick up, and the SBOM lands at SBOM.cdx.json for the
      # staging step below to publish as a standalone release asset (goreleaser's
      # --clean wipes dist/ but not the repo root, so the file survives the build).
      # -app-version records the release version as the SBOM's subject component;
      # it is empty for a snapshot gate (steps.kind sets it only for a pending
      # release), which the tool then omits. [LAW:one-source-of-truth] the SBOM
      # describes the SAME module set the license report does — same function,
      # same run — so the two release artifacts can never disagree.
      - name: Generate third-party license bundle, report + SBOM
        run: go run ./tools/licenses -pkg ./cmd/lit -bundle THIRD_PARTY_LICENSES -report LICENSE-REPORT.md -sbom SBOM.cdx.json -app-version "${{ steps.kind.outputs.version }}"

      # Build the custom release-builder image. GHA layer cache makes
      # subsequent runs reuse the (slow) ICU cross-build layers — only
      # Dockerfile edits or ARG bumps invalidate them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # qemu user-mode emulation so the arm64 Alpine execution check below can
      # run the linux/arm64 artifact on this amd64 runner.
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The git tree hash of build/ is the toolchain image's identity — it changes
      # iff a build/ input changes. release-smoke.yml derives the SAME tag from the
      # same git content to decide pull-vs-build, so the two never drift.
      # [LAW:one-source-of-truth]
      - name: Compute toolchain image tag
        id: imgtag
        run: echo "tree=$(git rev-parse HEAD:build)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release-builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.release
          tags: lit-release-builder:local
          load: true                       # make the image available to docker run
          cache-from: type=gha,scope=release-builder
          cache-to: type=gha,scope=release-builder,mode=max

      # goreleaser check first — cheap config-syntax validation.
      - name: goreleaser check (config syntax)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/go/src/app -w /go/src/app \
            -v "$(go env GOMODCACHE)":/go/pkg/mod:ro \
            lit-release-builder:local \
            check

      # Seed the SAME Go build cache release-smoke.yml restores on PRs. This is
      # the master-side half of a two-workflow contract: smoke runs only on
      # pull_request and restores `smoke-gocache-<go.sum>-<sha>` with a
      # `smoke-gocache-<go.sum>-` prefix fallback, but GHA cache scoping lets a
      # PR read only default-branch (master) and base caches — never a sibling
      # PR's. So a brand-new PR's first smoke run finds nothing to restore and
      # compiles the whole cgo/ICU/Dolt tree cold unless master has written into
      # that namespace. This step is master writing into it: the release build's
      # linux/amd64 compile objects (a superset — this build spans all five
      # targets) are exactly what smoke's `--single-target` linux/amd64 build
      # reuses, since both invoke goreleaser in this same image against the same
      # .goreleaser.yml, so the content-addressed GOCACHE entries match.
      # [LAW:one-type-per-behavior] identical key + restore-keys as smoke: one
      # GOCACHE contract, seeded here and consumed there — not a parallel scheme.
      # Size vs the 10GB repo LRU budget is self-managing: the key's per-sha
      # suffix writes one immutable entry per master build, and GHA evicts oldest
      # first, so the freshest seed (the one PRs want) always outlives the rest.
      - name: Seed the smoke Go build cache from master
        uses: actions/cache@v4
        with:
          path: ${{ env.SMOKE_GOCACHE }}
          key: smoke-gocache-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            smoke-gocache-${{ hashFiles('go.sum') }}-
            smoke-gocache-

      # Full snapshot build inside the image; produces archives + checksums
      # for every target in .goreleaser.yml.
      # GOMODCACHE is populated by the `go mod download` step above; mount it
      # read-only so goreleaser reuses the cached modules and the container
      # (running as root) cannot mutate the host cache.
      # GOCACHE is bind-mounted from the cache dir above and set via -e so the
      # --rm container's compile outputs survive the run to seed smoke.
      # [LAW:one-source-of-truth] that dir is the container's GOCACHE; the
      # bind-mount consumes it and actions/cache's post-step saves it.
      # For a pending release, materialize the version's tag LOCALLY at HEAD
      # (never pushed) so goreleaser stamps the real vX.Y.Z through its normal,
      # proven tag path — the same `release --clean` invocation a tag build would
      # run, driven here on master by the ephemeral tag. The tree is clean
      # for this (the generated THIRD_PARTY_LICENSES / LICENSE-REPORT.md are
      # gitignored), so non-snapshot goreleaser's clean-tree check passes. For an
      # ordinary push, `--snapshot` keeps the gate build clearly non-releasable.
      # [LAW:single-enforcer] one goreleaser invocation shape produces the release
      # artifact; the ephemeral tag is what makes this master-side build
      # bit-for-bit what a tag-side build would have produced.
      - name: Build artifacts
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_GOCACHE"
          ARGS="release --snapshot --clean"
          if [ "${{ steps.kind.outputs.release }}" = "true" ]; then
            git tag "v${{ steps.kind.outputs.version }}"
            ARGS="release --clean"
          fi
          docker run --rm \
            -v "$PWD":/go/src/app -w /go/src/app \
            -v "$(go env GOMODCACHE)":/go/pkg/mod:ro \
            -v "$SMOKE_GOCACHE":/gocache \
            -e GOCACHE=/gocache \
            lit-release-builder:local \
            $ARGS
          # The container ran as root, so /gocache is root-owned on the host
          # bind-mount; chown it back so actions/cache's post-step (running as
          # the runner user) can read and save it — same reason the manifest step
          # below chowns dist/. [LAW:no-silent-failure] do it explicitly, not by
          # hoping the save tolerates root-owned files.
          sudo chown -R "$(id -u):$(id -g)" "$SMOKE_GOCACHE"

      # mkmanifest runs OUTSIDE the container (only needs Go, which the runner
      # already has). The docker run that produced dist/ ran as root inside
      # the container, so dist/ is owned by root on the host bind-mount;
      # chown back to the runner user before mkmanifest tries to write into it.
      #
      # All four identity fields (version/tag/commit/date) come from
      # goreleaser's dist/metadata.json — the SAME values goreleaser injected
      # into the binaries via ldflags. Computing them freshly from git/date
      # here would introduce drift between what `lit version` reports and
      # what the manifest records. `tag` (v-prefixed) is distinct from
      # `version` (v-stripped) — see mkmanifest's docstring for why both are
      # required (URL segment vs filename match).
      - name: Generate release manifest
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist
          VERSION=$(jq -r .version dist/metadata.json)
          TAG=$(jq -r .tag dist/metadata.json)
          COMMIT=$(jq -r .commit dist/metadata.json | cut -c1-7)
          DATE=$(jq -r .date dist/metadata.json)
          go run ./tools/mkmanifest \
            -version "$VERSION" \
            -tag "$TAG" \
            -commit "$COMMIT" \
            -date "$DATE" \
            -dist ./dist \
            -base-url https://github.com/${{ github.repository }}/releases/download \
            -out ./dist/release-manifest.json

      # Assert the manifest is the shape we claim it is — concrete enough
      # that a silent build skip fails this check, not just that goreleaser
      # exited zero.
      - name: Assert manifest shape
        run: |
          set -euo pipefail
          MANIFEST=./dist/release-manifest.json

          # jq predicates: every step uses an explicit value, NOT a bare `.`
          # that rebinds across `|`. (`.x | type == "string" and length > 0`
          # parses as `(.x | type) == "string" and (length > 0)` — the
          # `length > 0` would be computed against the WHOLE manifest, not
          # against .x. Be explicit.)
          jq -e '(.version | type) == "string" and (.version | length) > 0' "$MANIFEST" >/dev/null
          jq -e '
            (.schema_support.min | type) == "number" and (.schema_support.min) >= 1 and
            (.schema_support.max | type) == "number"
          ' "$MANIFEST" >/dev/null
          # URL shape: `<base>/<tag>/<filename>` where tag comes from
          # dist/metadata.json. We assert the tag segment is literally
          # present in every URL — that's what would have caught the bug
          # where mkmanifest had been using the v-stripped version as the
          # URL segment (producing /releases/download/0.1.0/... 404s
          # instead of the correct /releases/download/v0.1.0/...).
          TAG=$(jq -r .tag dist/metadata.json)
          jq -e --arg tag "$TAG" '
            (.artifacts | length) > 0 and
            ((.artifacts) | all(.platform | test("^[a-z0-9]+/[a-z0-9]+$"))) and
            ((.artifacts) | all(.url | startswith("https://github.com/"))) and
            ((.artifacts) | all(.url | contains("/" + $tag + "/"))) and
            ((.artifacts) | all(.sha256 | test("^[0-9a-f]{64}$")))
          ' "$MANIFEST" >/dev/null

          # This list is the release contract, restated independently of
          # .goreleaser.yml ON PURPOSE: deriving it from the config that
          # drives the build would make this check pass on a silent build
          # skip — the exact failure it exists to catch. When the goreleaser
          # goos/goarch matrix changes, update this array in the same PR.
          # [LAW:verifiable-goals]
          EXPECTED='["darwin/amd64","darwin/arm64","linux/amd64","linux/arm64","windows/amd64"]'
          GOT=$(jq -c '[.artifacts[].platform] | sort' "$MANIFEST")
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "manifest platforms mismatch" >&2
            echo "  expected: $EXPECTED" >&2
            echo "  got:      $GOT" >&2
            exit 1
          fi

          echo "release-manifest.json shape OK; platforms: $GOT"

      # links-supply-chain-w6m9.1's acceptance criterion, checked against a
      # REAL archive rather than the repo-root files the generator step wrote
      # directly: this proves goreleaser's archives.files (.goreleaser.yml)
      # actually picked them up, not just that tools/licenses ran.
      # [LAW:verifiable-goals]
      - name: Assert release archive carries the license bundle + report
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          # An unquoted-glob `tar -xzf dist/lit_*_linux_amd64.tar.gz` would,
          # on more than one match, bind only the first as the archive and
          # silently treat the rest as extraction member names — GNU tar
          # exits 0 on a missing member (stderr warning only), so a stale
          # second archive could make this step read the WRONG file with no
          # error. --clean (the snapshot build above) guarantees exactly one
          # match today, but assert it explicitly rather than depending on
          # that being true forever. [LAW:no-silent-failure]
          archives=(dist/lit_*_linux_amd64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "expected exactly one linux/amd64 archive, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          tar -xzf "${archives[0]}" -C "$workdir" THIRD_PARTY_LICENSES LICENSE-REPORT.md
          grep -q 'github.com/dolthub/dolt/go' "$workdir/THIRD_PARTY_LICENSES"
          # Anchored to dolt's own section on purpose. A bare `Apache License`
          # match over the whole bundle stopped being evidence about dolt the
          # moment compiler-rt began shipping the full Apache 2.0 text: dolt's
          # notice could vanish entirely and the unanchored grep would still
          # pass on compiler-rt's copy. The point of this line is that the
          # license TEXT rides along, not just the row.
          #
          # The window counts the bundle section's HEADER lines, and that header
          # grows: links-licensing-c0ce.15 added a `Source:` line to replaced
          # modules, of which dolt is one, leaving the previous -A 8 passing with
          # two lines to spare. This job does not run on pull requests, so a
          # window that goes one line short fails at tag-cut and nowhere earlier.
          # 12 keeps slack for another header line without reaching anywhere near
          # the next section — the Apache text between them is ~200 lines, so the
          # anchoring this check exists for is untouched.
          grep -A 12 '^github.com/dolthub/dolt/go ' "$workdir/THIRD_PARTY_LICENSES" | grep -q 'Apache License'
          grep -q '| github.com/dolthub/dolt/go | .* | Apache-2.0 |' "$workdir/LICENSE-REPORT.md"
          # links-supply-chain-w6m9.4: the statically-linked native C libraries
          # must ride the SAME shipped bundle, with their notice text — not just
          # the Go modules. Check all four by both their report row and a notice
          # substring unique to each embedded license text.
          grep -q '| icu | 75.1 | Unicode-3.0 |' "$workdir/LICENSE-REPORT.md"
          grep -q 'UNICODE LICENSE V3' "$workdir/THIRD_PARTY_LICENSES"
          grep -q '| zstd | 1.5.6 | BSD-3-Clause |' "$workdir/LICENSE-REPORT.md"
          grep -q 'Zstandard' "$workdir/THIRD_PARTY_LICENSES"
          grep -q '| musl | 1.2.5 | MIT |' "$workdir/LICENSE-REPORT.md"
          grep -q 'musl as a whole is licensed under the following standard MIT license' "$workdir/THIRD_PARTY_LICENSES"
          # compiler-rt's row is a compound SPDX expression, not a bare id: the
          # component is MIT as part of Zig AND carries routines ported from
          # Apache-licensed LLVM sources. Both notices ship, so both are checked.
          grep -q '| compiler-rt | 0.14.0 | MIT AND Apache-2.0 WITH LLVM-exception |' "$workdir/LICENSE-REPORT.md"
          grep -q 'The MIT License (Expat)' "$workdir/THIRD_PARTY_LICENSES"
          grep -q 'The LLVM Project is under the Apache License v2.0 with LLVM Exceptions' "$workdir/THIRD_PARTY_LICENSES"
          echo "OK: archive carries THIRD_PARTY_LICENSES + LICENSE-REPORT.md, covering dolt (Go) and all four native libs (icu, zstd, musl, compiler-rt)"

      # Stage the CycloneDX SBOM as a standalone, versioned release asset —
      # modeled on release-manifest.json, NOT on the in-archive license bundle:
      # the linked-module set is platform-independent, so one SBOM covers every
      # artifact and a scanner can fetch it by URL without pulling a platform
      # archive. The generator wrote SBOM.cdx.json at the repo root before
      # goreleaser ran (so --clean, which wipes dist/, left it untouched); name
      # the staged copy with the SAME version segment the archives use —
      # dist/metadata.json's .version, goreleaser's authoritative version — so
      # the SBOM filename can't drift from the archive filenames.
      # [LAW:one-source-of-truth]
      #
      # Release-only, like 'Upload validated release artifact' below: producing
      # a *publishable, versioned* SBOM asset is release-shaped work. On a
      # snapshot gate steps.kind.outputs.version is empty, so the SBOM content
      # omits the version (see sbom.go) while dist/metadata.json carries a
      # snapshot version — staging then would name the file for a version the
      # content omits. Gating here means a staged SBOM exists only when its
      # content version (steps.kind.outputs.version) equals the filename version
      # (dist/metadata.json .version) by construction. The generator itself
      # still runs on every push (it also emits the bundle/report goreleaser
      # needs), so a broken SBOM generator is still caught before a tag is cut.
      # [LAW:dataflow-not-control-flow] release-vs-snapshot is the value that
      # decides whether a publishable asset is produced.
      - name: Stage the SBOM as a versioned release asset
        if: steps.kind.outputs.release == 'true'
        run: |
          set -euo pipefail
          test -f SBOM.cdx.json || { echo "::error::SBOM.cdx.json missing — the generator step did not produce it" >&2; exit 1; }
          VERSION=$(jq -r .version dist/metadata.json)
          DEST="dist/lit_${VERSION}_sbom.cdx.json"
          cp SBOM.cdx.json "$DEST"

          # The filename version ($VERSION, from goreleaser's tag parse in
          # metadata.json) and the SBOM's embedded metadata.component.version
          # (-app-version, from steps.kind's CHANGELOG regex) are two independent
          # derivations that agree by construction — steps.kind's value creates
          # the ephemeral tag goreleaser reads. This guard makes the agreement
          # CHECKED: if goreleaser ever normalizes the version differently, the
          # release fails here rather than shipping a file whose name and content
          # disagree. [LAW:one-source-of-truth] [LAW:no-silent-failure]
          ACTUAL=$(jq -r '.metadata.component.version' "$DEST")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::SBOM content version ($ACTUAL) != release/filename version ($VERSION) — metadata.component and the filename disagree" >&2
            exit 1
          fi
          echo "staged $DEST (content version $ACTUAL matches filename)"

      # links-supply-chain-w6m9.2's acceptance criterion, checked against the
      # STAGED dist/ asset (the exact bytes publish uploads), not the repo-root
      # copy: the SBOM must validate as CycloneDX via the official cyclonedx-cli
      # — the tool the ticket names — AND list github.com/dolthub/dolt at its
      # pinned version. A validated-but-wrong SBOM (dolt dropped) still fails
      # here because the content check is separate from the schema check.
      # [LAW:verifiable-goals] [LAW:no-silent-failure]
      #
      # Release-only, matching the staging step above: it validates the staged
      # asset, which exists only for a release, and it keeps the external
      # cyclonedx-cli download off the snapshot-gate critical path. publish
      # (needs: validate) runs only after this passes, so a schema-invalid SBOM
      # blocks the release loudly instead of shipping.
      - name: Validate the CycloneDX SBOM and assert it covers dolt
        if: steps.kind.outputs.release == 'true'
        env:
          # Pinned so the validator version is a single, reviewable value — the
          # newest cyclonedx-cli that accepts spec 1.6 (the version the SBOM is
          # emitted at; see tools/licenses/sbom.go sbomSpecVersion).
          CYCLONEDX_CLI_VERSION: v0.27.2
          # sha256 of that version's cyclonedx-linux-x64 asset. We EXECUTE this
          # downloaded binary, so it is verified against a pinned hash rather
          # than trusted on TLS alone — fitting for a supply-chain workflow. No
          # per-binary .sha256 sidecar is published for this release, so the
          # value is pinned here (not fetched from the same origin it would
          # authenticate); a version bump must update this hash in the same edit
          # or the check below fails loudly. [LAW:no-silent-failure]
          CYCLONEDX_CLI_SHA256: 5e1595542a6367378a3944bbd3008caab3de65d572345361d3b9597b1dbbaaa0
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version dist/metadata.json)
          SBOM="dist/lit_${VERSION}_sbom.cdx.json"

          bin=$(mktemp)
          trap 'rm -f "$bin"' EXIT
          curl -fsSL -o "$bin" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  ${bin}" | sha256sum -c -
          chmod +x "$bin"

          "$bin" validate --input-file "$SBOM" --input-format json --fail-on-errors

          # dolt present exactly once, with a non-empty version. Explicit
          # ($x | fn) forms throughout — a bare `.version | type == "string" and
          # length > 0` would compute `length` against the wrong value (the same
          # jq precedence trap the manifest assertion documents above).
          jq -e '
            ([.components[] | select(.name == "github.com/dolthub/dolt/go")]) as $d
            | ($d | length) == 1
              and ($d[0].version | type) == "string"
              and ($d[0].version | length) > 0
          ' "$SBOM" >/dev/null
          echo "OK: $SBOM validates as CycloneDX and lists github.com/dolthub/dolt at $(jq -r '.components[] | select(.name=="github.com/dolthub/dolt/go") | .version' "$SBOM")"

      # The linux artifacts must be fully static musl binaries: no PT_INTERP,
      # no NEEDED, and they must EXECUTE on both a glibc host (this runner) and
      # a stock Alpine/musl container, on both arches (arm64 under qemu). This
      # is the release-level twin of release-smoke.yml's per-PR check, extended
      # to arm64 — the arch the original glibc-only bug shipped broken.
      # [LAW:verifiable-goals] [LAW:no-silent-failure]
      - name: Assert linux binaries are static and run on glibc + musl (amd64 + arm64)
        run: |
          set -euo pipefail
          declare -A bin
          for arch in amd64 arm64; do
            workdir=$(mktemp -d)
            tar -xzf dist/lit_*_linux_"$arch".tar.gz -C "$workdir" lit
            bin[$arch]="$workdir/lit"
            echo "=== linux/$arch: ${bin[$arch]}"
            if readelf -l "${bin[$arch]}" | grep -q 'INTERP'; then
              echo "FAIL: linux/$arch binary has a PT_INTERP entry; not static" >&2
              exit 1
            fi
            if readelf -d "${bin[$arch]}" | grep -q 'NEEDED'; then
              echo "FAIL: linux/$arch binary has NEEDED dynamic deps; not static" >&2
              exit 1
            fi
            echo "OK: no PT_INTERP, no NEEDED — fully static"
            echo "--- execute on musl (alpine, $arch)"
            docker run --rm --platform "linux/$arch" \
              -v "${bin[$arch]}":/usr/local/bin/lit:ro alpine:3.20 lit version
          done
          echo "--- execute on glibc host (ubuntu runner, amd64)"
          "${bin[amd64]}" version

      # Retain the artifact that just passed every assertion above so the publish
      # job consumes exactly THESE bytes instead of rebuilding. Keyed by commit
      # SHA — the publish job below downloads it by the same SHA within this run.
      # Only for a pending release; a snapshot gate produces nothing publishable,
      # so the step is skipped (not a partial upload). [LAW:one-source-of-truth]
      # this is the single build of the release; the publish job publishes it
      # verbatim, never a second build. [LAW:no-silent-failure] `if-no-files-found: error` turns a
      # goreleaser output-shape drift into a loud failure here, not a silent
      # empty artifact that fails mysteriously at publish time.
      - name: Upload validated release artifact
        if: steps.kind.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.sha }}
          path: |
            dist/lit_*_*_*.tar.gz
            dist/lit_*_*_*.zip
            dist/lit_*_sbom.cdx.json
            dist/checksums.txt
            dist/release-manifest.json
            dist/metadata.json
          retention-days: 14
          if-no-files-found: error

      # Publish the `smoke` stage to GHCR for release-smoke.yml to pull, tagged by
      # the build/ tree hash. This runs ONLY after every assertion above passed, so
      # a broken image is never published — that is what "publish only on a
      # successful build" means here. The smoke stage's layers were already built
      # as part of `final` above (final FROM smoke), so buildx reuses the cache and
      # this step just assembles and pushes. The tag is content-addressed, so
      # pushing the same build/ tree twice is idempotent and pushing from any
      # branch is safe. [LAW:single-enforcer] the master image build is the one
      # place the toolchain image is produced; PR gates consume, never rebuild.
      - name: Publish release-builder smoke image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.release
          target: smoke
          tags: ghcr.io/${{ github.repository_owner }}/lit-release-builder:smoke-${{ steps.imgtag.outputs.tree }}
          push: true
          cache-from: type=gha,scope=release-builder
          cache-to: type=gha,scope=release-builder,mode=max

      - name: Upload snapshot dist/ for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validate-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Promote the validated build to a published release. Runs ONLY when validate
  # flagged a pending release, and ONLY after it fully succeeded — so we publish
  # exactly the bytes that passed every assertion, from the same run that built
  # them (no rebuild, no cross-run handoff). The tag is created here too:
  # `gh release create` cuts the tag at the validated commit and publishes
  # atomically. [LAW:single-enforcer] one place cuts a release — this job — and
  # it can only publish what validate built. The tag is cut BY CI; nothing pushes
  # it from a local machine.
  publish:
    # needs BOTH: validate builds the artifact; license-gate is the
    # publish-blocking freedom check (links-supply-chain-w6m9.5). If license-gate
    # fails, this job is skipped and nothing is tagged or published — the release
    # aborts before any asset ships. If validate is skipped (snapshot), the `if`
    # below keeps publish off anyway. [LAW:no-silent-failure] a non-free posture
    # cannot reach a published release.
    needs: [validate, license-gate]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the tag + GitHub Release
    steps:
      # Same-run artifact from the validate job above — download by name, no
      # run-id needed. [LAW:one-source-of-truth] this is the one build of the
      # release; we publish it verbatim.
      - name: Download the validated artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ github.sha }}
          path: _artifact

      # [LAW:no-silent-failure] upload-artifact strips the least-common-ancestor
      # of the uploaded paths, so the files land at either _artifact/ or
      # _artifact/dist/ depending on that rule — unverifiable locally and liable to
      # change under us. Rather than hard-code a nesting (a wrong guess silently
      # globs an empty path into `gh release create`, publishing a release with no
      # binaries), locate the real dist dir by finding metadata.json. Exactly one,
      # or fail loudly. Everything downstream reads $DIST.
      - name: Locate the downloaded dist dir
        run: |
          set -euo pipefail
          mapfile -t metas < <(find _artifact -name metadata.json)
          if [ "${#metas[@]}" -ne 1 ]; then
            echo "::error::expected exactly one metadata.json in the downloaded artifact, found ${#metas[@]}: ${metas[*]}" >&2
            exit 1
          fi
          echo "DIST=$(dirname "${metas[0]}")" >> "$GITHUB_ENV"

      # The artifact's stamped identity must match the commit + version this job
      # is releasing. It does by construction (validate built it in this run), but
      # verify rather than trust. [LAW:no-silent-failure]
      - name: Verify the artifact matches this release
        run: |
          set -euo pipefail
          MSHA=$(jq -r .commit "$DIST/metadata.json")
          MTAG=$(jq -r .tag "$DIST/metadata.json")
          if [ "$MSHA" != "${{ github.sha }}" ]; then
            echo "::error::artifact commit ($MSHA) != release commit (${{ github.sha }})"; exit 1
          fi
          if [ "$MTAG" != "v${{ needs.validate.outputs.version }}" ]; then
            echo "::error::artifact tag ($MTAG) != pending version (v${{ needs.validate.outputs.version }})"; exit 1
          fi

      # gh release create makes the tag at --target (the validated commit) AND
      # publishes in one step. Asset globs mirror goreleaser's name_template
      # (`lit_<version>_<goos>_<goarch>`); tar.gz covers linux/darwin, zip windows.
      # Re-runs after a CLEAN success are safe: once this tag exists on origin,
      # validate's kind resolver sees it and this job no longer runs. A PARTIAL
      # failure (tag created but asset upload died) leaves a dangling tag that would
      # make that same resolver skip the publish forever — so we surface it loudly
      # with an explicit recovery path instead of letting it vanish.
      # [LAW:no-silent-failure]
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.validate.outputs.version }}"
          # Assemble the asset list from files that ACTUALLY EXIST and assert it's
          # non-empty, so a nesting/naming drift fails HERE rather than publishing a
          # release with no binaries. The `-f` filter is load-bearing: nullglob
          # drops unmatched *globs* (lit_*.tar.gz) but NOT literal names
          # (checksums.txt) — without the existence test those literals would keep a
          # wrong path in the list and hide an otherwise-empty download.
          shopt -s nullglob
          assets=()
          for f in "$DIST"/lit_*_*_*.tar.gz "$DIST"/lit_*_*_*.zip "$DIST"/lit_*_sbom.cdx.json "$DIST"/checksums.txt "$DIST"/release-manifest.json; do
            [ -f "$f" ] && assets+=( "$f" )
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release assets found under $DIST — refusing to publish an empty release" >&2
            exit 1
          fi
          if ! gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes \
            "${assets[@]}"; then
            echo "::error::gh release create failed for $TAG. A tag and/or partial release may now exist on origin; validate's kind resolver would then see the tag and skip this publish on every re-run, silently dropping the release. Recovery: 'gh release delete $TAG --repo ${{ github.repository }} --cleanup-tag --yes' removes both the partial release and the tag, then re-run via workflow_dispatch or a fresh master push." >&2
            exit 1
          fi
          echo "published $TAG at ${{ github.sha }}"
