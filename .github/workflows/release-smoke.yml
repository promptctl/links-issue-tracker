name: Release smoke

# Fast PR gate for the release path. Builds ONE target (linux/amd64) with
# goreleaser inside the release-builder image's `smoke` stage, so a PR proves
# the things that break per code change — Go compiles, the cgo + ICU link
# recipe works, .goreleaser.yml parses, and the produced linux binary is the
# fully static musl artifact we actually ship — without paying for the
# five-target cross-build.
#
# [LAW:single-enforcer] this workflow owns the *code-level* release invariant
# (does a goreleaser build of this commit produce a runnable linux binary?);
# release-validate.yml owns the *release-level* invariant (do all five
# cross-targets + the manifest assemble?) and runs out-of-band. Splitting them
# by change-reason keeps the PR feedback loop fast: the 5-platform cross-build
# is a release-time cost, not a per-PR cost, so it must never sit on this path.
#
# The `smoke` Dockerfile stage carries the toolchain plus only the linux/amd64
# ICU prefix. Rather than rebuild that stage's ICU cross-toolchain from source on
# every PR — the ~1hr cold cliff, because a sibling PR cannot read another PR's
# GHA buildx cache, so the first run of each new PR missed and rebuilt from
# scratch — this workflow PULLS the prebuilt image master publishes for the exact
# `build/` tree (see release-validate.yml). The pull tag is the git tree hash of
# `build/` [LAW:one-source-of-truth]: it changes iff a toolchain input changes, so
# a PR that leaves `build/` untouched pulls in seconds, while a PR that edits
# `build/` finds no published image for its tree and falls through to a
# from-source build — which is exactly the PR that must prove the new toolchain.
# [LAW:one-type-per-behavior] pulled or built, it is the identical recipe the
# release ships (zig cc x86_64-linux-musl, static ICU, -static link) — not a
# native-glibc stand-in that would hide a broken musl link until release time.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read    # pull the prebuilt release-builder image published from master

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # goreleaser derives the snapshot version from git

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # setup-go RESTORES a module cache keyed on go.sum; it does not run any
      # `go` command, so on a cold cache GOMODCACHE is empty. The build mounts
      # it :ro into the container, where goreleaser cannot then download the
      # missing modules. Populate it here so the read-only mount is correct by
      # construction. [LAW:one-source-of-truth] this step is the populated
      # GOMODCACHE; the :ro mount consumes it.
      - name: Populate module cache
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image identity is the git tree hash of build/ — the SAME value
      # release-validate.yml tags its published image with. Deriving both from git
      # content is why publisher and consumer never drift. [LAW:one-source-of-truth]
      - name: Compute toolchain image tag
        id: imgtag
        run: echo "tree=$(git rev-parse HEAD:build)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the prebuilt toolchain image master published for this exact build/
      # tree. A hit skips the from-source ICU cross-build entirely (the cold
      # cliff). A miss — this PR changed build/, so no image exists for its tree
      # hash, or (rarely) master has not published it yet — surfaces as a visible
      # continue-on-error warning on this step and falls through to the from-source
      # build below. [LAW:no-silent-failure] the miss is marked, not swallowed;
      # [LAW:single-enforcer] the image still owns the toolchain inventory, this
      # workflow installs no compilers or ICU of its own.
      - name: Pull prebuilt release-builder image
        id: pull
        continue-on-error: true
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/lit-release-builder:smoke-${{ steps.imgtag.outputs.tree }}"
          echo "Pulling prebuilt toolchain image: $IMG"
          docker pull "$IMG"
          docker tag "$IMG" lit-release-builder:smoke

      # Fallback: build the smoke image from source. Fires only on a pull miss.
      # Same Dockerfile, same target, same recipe as the published image — slower,
      # never different. [LAW:one-type-per-behavior] The cache-to seeds THIS PR's
      # ref cache so a re-push of a build/-editing PR is warm.
      - name: Build release-builder smoke image (fallback)
        if: steps.pull.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.release
          target: smoke
          tags: lit-release-builder:smoke
          load: true
          cache-from: type=gha,scope=release-builder
          cache-to: type=gha,scope=release-builder,mode=max

      # The goreleaser build below runs in a --rm container, so its GOCACHE would
      # vanish with the container and the whole cgo/ICU/Dolt tree would recompile
      # cold (~4 min) every run. Persist it across runs and mount it in, turning an
      # unchanged-source re-run into an incremental compile. Keyed on go.sum with a
      # rolling per-sha suffix so each run saves a fresh immutable entry and the
      # restore-keys fall back to the most recent match.
      # [LAW:one-source-of-truth] this cache dir is the container's GOCACHE; the
      # bind-mount below consumes it.
      - name: Restore Go build cache for the goreleaser container
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/smoke-gocache
          key: smoke-gocache-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            smoke-gocache-${{ hashFiles('go.sum') }}-
            smoke-gocache-

      # --single-target builds only linux/amd64 (the container arch);
      # --snapshot avoids needing a tag. No cross-build: fast.
      - name: Build linux/amd64 target (snapshot)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-gocache"
          docker run --rm \
            -v "$PWD":/go/src/app -w /go/src/app \
            -v "$(go env GOMODCACHE)":/go/pkg/mod:ro \
            -v "$RUNNER_TEMP/smoke-gocache":/gocache \
            -e GOCACHE=/gocache \
            lit-release-builder:smoke \
            build --single-target --snapshot --clean
          # The container ran as root, so /gocache is root-owned on the host
          # bind-mount; chown it back so actions/cache's post-step (running as the
          # runner user) can read and save it — same reason release-validate chowns
          # dist/. [LAW:no-silent-failure] do it explicitly, not by hoping the save
          # tolerates root-owned files.
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/smoke-gocache"

      # Prove the artifact is the universal static binary we claim to ship, not
      # just that it compiled — and prove it by EXECUTION, on both libcs:
      #   - no PT_INTERP program header and no NEEDED entries (fully static;
      #     this is what would have caught the original glibc-dynamic binary
      #     that built green but could not start on Alpine),
      #   - runs on this glibc (ubuntu) runner,
      #   - runs on a stock Alpine (musl) container.
      # [LAW:verifiable-goals] [LAW:no-silent-failure]
      - name: Assert linux/amd64 binary is static and runs on glibc + musl
        run: |
          set -euo pipefail
          BIN=$(find dist -type f -name lit | head -n1)
          test -n "$BIN" || { echo "no lit binary found in dist/" >&2; exit 1; }
          echo "Inspecting $BIN"
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "FAIL: binary has a PT_INTERP (dynamic loader) entry; not static" >&2
            exit 1
          fi
          if readelf -d "$BIN" | grep -q 'NEEDED'; then
            echo "FAIL: binary has NEEDED dynamic dependencies; not static" >&2
            exit 1
          fi
          echo "OK: no PT_INTERP, no NEEDED — fully static"
          echo "--- execute on glibc host (ubuntu runner)"
          "./$BIN" version
          echo "--- execute on musl host (alpine container)"
          docker run --rm -v "$PWD/$BIN":/usr/local/bin/lit:ro alpine:3.20 lit version
