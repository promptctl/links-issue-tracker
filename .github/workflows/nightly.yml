# The full test lane. CI's PR gate runs `go test -short ./...` — the inner
# loop — which skips the tests whose cost is deliberately generated scale.
# This workflow is the other half of that bargain: everything the gate skips
# runs here, on a schedule, in full. Without `-short`, `testing.Short()` is
# false by construction, so the scale lane cannot skip — the gate being open
# here is guaranteed by Go, not by convention.
#
# A nightly job whose failures nobody sees is deletion with extra steps, so a
# failed run files (or extends) a GitHub issue labeled `nightly-failure` with
# the run URL. [LAW:no-silent-failure]
name: Nightly full suite

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A dispatched run overlapping the scheduled one must queue, not race: two
# concurrent failing runs would each see no open nightly-failure issue and
# file a duplicate. Never cancel-in-progress — a cancelled full lane is a
# skipped full lane.
concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # A wedged fold or an unbounded replay should fail here, not burn six
    # hours of runner. Generous relative to the ~20 minutes the suite needs,
    # tight relative to a hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-dolt

      - name: Build
        run: go build ./cmd/lit

      # -timeout 30m: internal/store alone measured ~8 minutes of real work on
      # the development machine (2026-08-24, links-testperf-xxsx) and the scale
      # test adds two more, so go test's 10-minute per-package default can
      # panic a healthy run on slow-enough hardware. This is the lane where that cost is
      # legitimate — the budget is honest here and forbidden in ci.yml, where
      # the same flag would hide an inner-loop regression.
      - name: Test (full, no -short)
        run: go test -timeout 30m ./...

      # failure() alone would miss the job-level timeout: GitHub marks a
      # timed-out job cancelled, not failed, so the wedge this workflow's
      # timeout exists to catch is exactly the case a bare failure() guard
      # would let pass in silence. [LAW:no-silent-failure]
      - name: Report failure as a GitHub issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Nightly full-suite run did not finish green: ${run_url}

          A step in this job failed, or the job was cancelled (a job that hits its 60-minute timeout also reports cancelled) — read the run log for which step and why. This lane runs everything the PR gate's \`-short\` skips; triage it, do not mute this job."
          gh label create nightly-failure --force \
            --description "The scheduled full test lane is red" --color B60205
          # One open issue collects repeat failures; a new day's failure lands
          # as a comment, not a duplicate issue.
          existing=$(gh issue list --label nightly-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly full test lane is failing" \
              --label nightly-failure --body "$body"
          fi
