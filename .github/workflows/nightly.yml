# The full test lane. CI's PR gate runs `go test -short ./...` — the inner
# loop — which skips the tests whose cost is deliberately generated scale.
# This workflow is the other half of that bargain: everything the gate skips
# runs here, on a schedule, in full. Without `-short`, `testing.Short()` is
# false by construction, so the scale lane cannot skip — the gate being open
# here is guaranteed by Go, not by convention. The Windows lane runs here too,
# for the platform the Linux-only gate cannot execute.
#
# A nightly job whose failures nobody sees is deletion with extra steps, so a
# red run files (or extends) an urgent lit bug labeled `nightly-failure`
# through .github/actions/report-to-lit. [LAW:no-silent-failure]
name: Nightly full suite

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A dispatched run overlapping the scheduled one must queue, not race: two
# concurrent failing runs would each see no open nightly-failure ticket and
# file a duplicate. Never cancel-in-progress — a cancelled full lane is a
# skipped full lane.
concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # A wedged fold or an unbounded replay should fail here, not burn six
    # hours of runner. Generous relative to the ~20 minutes the suite needs,
    # tight relative to a hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-dolt

      - uses: ./.github/actions/install-claude

      - name: Build
        run: go build ./cmd/lit

      # -timeout 30m: internal/store alone measured ~8 minutes of real work on
      # the development machine (2026-08-24, links-testperf-xxsx) and the scale
      # test adds two more, so go test's 10-minute per-package default can
      # panic a healthy run on slow-enough hardware. This is the lane where that cost is
      # legitimate — the budget is honest here and forbidden in ci.yml, where
      # the same flag would hide an inner-loop regression.
      - name: Test (full, no -short)
        run: go test -timeout 30m ./...

      # Canonical is generated from a Token index that lives in another
      # repository, so nothing in the PR gate can see that index change. This
      # step does, and it runs even when the suite failed so one red night
      # cannot hide the other. [LAW:no-silent-failure]
      - name: Law-token index matches upstream
        if: ${{ !cancelled() }}
        run: go run ./tools/lawtokens-sync -check

  # Windows is a release target, and this is the one lane that executes it.
  # The store's filesystem primitives - lock share modes, renaming over an open
  # handle, hard links, unlinking while open - behave differently there, and no
  # Linux run can show it. It runs nightly, not in ci.yml: the PR gate stays
  # Linux-only and fast, and a Windows-only regression turns this lane red the
  # night after it merges.
  #
  # Scope is the shipped binary and its libraries, the race lane's boundary in
  # ci.yml, with -short for the same reason: the scale tests add volume, not
  # platform coverage.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The release builds from an LF tree, so these tests read the bytes that
      # ship. The runner's git defaults to core.autocrlf=true, which would
      # rewrite every text file to CRLF and fail tests on bytes no user gets.
      - name: Check out with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # cgo needs a C/C++ toolchain and ICU (go-icu-regex). MSYS2's UCRT64
      # environment provides both; path-type inherit keeps setup-go's Go on
      # PATH, and ICU's DLLs sit on that PATH when the test binaries load.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-icu

      - uses: ./.github/actions/install-dolt

      - uses: ./.github/actions/install-claude

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./cmd/lit

      - name: Test (-short)
        env:
          CGO_ENABLED: '1'
        run: go test -short -timeout 30m ./cmd/... ./internal/...

  # Each lane reports in its own job, so no suite runs holding the write token
  # a report needs. Each lane has its own alarm label too: one lane's open
  # ticket must not absorb the other lane's red runs as "Red again" comments,
  # or a Linux regression would hide behind a Windows red that is already
  # known. `result != 'success'` covers failure, cancellation, and the
  # job-level timeout, which GitHub reports as cancelled. [LAW:no-silent-failure]
  # Only master's runs report: the backlog is master's, and a run dispatched
  # on a branch is red in front of the session that dispatched it.
  report:
    needs: full-suite
    if: ${{ always() && needs.full-suite.result != 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: nightly-failure
          title: Nightly full test lane is failing
          token: ${{ github.token }}
          body: |
            A step in the nightly full-suite job failed, or the job was cancelled (a job that hits its 60-minute timeout also reports cancelled); the run log names which step and why. This lane runs everything the PR gate's `-short` skips, plus the law-token upstream check: triage it, do not mute it.

  report-windows:
    needs: windows
    if: ${{ always() && needs.windows.result != 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: nightly-windows-failure
          title: Nightly Windows test lane is failing
          token: ${{ github.token }}
          body: |
            A step in the nightly windows job failed, or the job was cancelled (a job that hits its 60-minute timeout also reports cancelled); the run log names which step and why. This lane is the only place lit's tests run on Windows, a release target, so a failure here is a Windows-only regression no other lane can show: triage it, do not mute it.
