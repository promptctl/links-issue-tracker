# The full test lane. CI's PR gate runs `go test -short ./...` — the inner
# loop — which skips the tests whose cost is deliberately generated scale.
# This workflow is the other half of that bargain: everything the gate skips
# runs here, on a schedule, in full. Without `-short`, `testing.Short()` is
# false by construction, so the scale lane cannot skip — the gate being open
# here is guaranteed by Go, not by convention. The Windows lane runs here too,
# for the platform the Linux-only gate cannot execute.
#
# A nightly job whose failures nobody sees is deletion with extra steps, so a
# red lane files (or extends) an urgent lit bug under its own label,
# `nightly-failure` or `nightly-windows-failure`, through
# .github/actions/report-to-lit. [LAW:no-silent-failure]
name: Nightly full suite

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A dispatched run overlapping the scheduled one must queue, not race: two
# concurrent failing runs would each see no open ticket under a lane's label
# and file a duplicate. Never cancel-in-progress — a cancelled full lane is a
# skipped full lane.
concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # A wedged fold or an unbounded replay should fail here, not burn six
    # hours of runner. Generous relative to the ~20 minutes the suite needs,
    # tight relative to a hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-claude

      - name: Build
        run: go build ./cmd/lit

      # -timeout 30m: internal/store alone measured ~8 minutes of real work on
      # the development machine (2026-08-24, links-testperf-xxsx) and the scale
      # test adds two more, so go test's 10-minute per-package default can
      # panic a healthy run on slow-enough hardware. This is the lane where that cost is
      # legitimate — the budget is honest here and forbidden in ci.yml, where
      # the same flag would hide an inner-loop regression.
      - name: Test (full, no -short)
        run: go test -timeout 30m ./...

      # Canonical is generated from a Token index that lives in another
      # repository, so nothing in the PR gate can see that index change. This
      # step does, and it runs even when the suite failed so one red night
      # cannot hide the other. [LAW:no-silent-failure]
      - name: Law-token index matches upstream
        if: ${{ !cancelled() }}
        run: go run ./tools/lawtokens-sync -check

      # The store size ceiling is derived from what a design-size store costs
      # on disk, with headroom over each measured figure
      # (internal/store/designstore). This measures that store and exits 2
      # when its compacted bytes or bytes/commit pass their allowance: the
      # derivation is then false, and the answer is a ticket, never a raised
      # allowance. `design` resolves to the ceiling's own row count, so the size
      # judged here cannot drift from the size the ceiling assumes. The same
      # run judges every command's latency and a 100-writer storm at that size.
      # About 4 minutes on this runner. Built, then run, as ci.yml's
      # perf-budget is, so exit 2 survives. [LAW:one-source-of-truth]
      - name: At the design size, the ceiling's allowances, the latency budget and the writer storm hold
        if: ${{ !cancelled() }}
        run: |
          go build -o "$RUNNER_TEMP/perfbench" ./tools/perfbench
          "$RUNNER_TEMP/perfbench" --sizes design

  # The budget at ten times, on both axes the fleet grows along: one store ten
  # times today's largest (10x-store), and ten times today's stores, each at
  # its own size (10x-fleet), both derived from one census
  # (tools/perfbench/plan.go fleetCensus). The PR gate catches the cliff at
  # today's size; this catches the slope, the night after it lands, and never
  # blocks a pull request.
  #
  # A RED LIMIT IS THE DESIGN'S LIMIT, NOT A BAD COMMIT. Every verdict
  # perfbench reaches is written to --limits the moment it is reached, keyed
  # by the limit it breaks, and each limit is its own ticket: a new one
  # arrives urgent, a known one gets that night's measured value as a comment.
  # The answer to one is work on that limit. Raising a budget or an allowance
  # to turn this green is the alarm disconnected. [LAW:no-silent-failure]
  #
  # The scale points are listed once, here, and the legs and the verdict both
  # read them, so a leg that never reported is a leg the verdict knows is
  # missing. [LAW:one-source-of-truth]
  scale-points:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      points: ${{ steps.points.outputs.points }}
    steps:
      # Each leg's timeout frees a runner from a hang no step budget names.
      # Measured on ubuntu-latest, run 40043414613: 10x-store took 1h33m (the
      # import 86m, the probes, compaction, history and storm 7m), so 200
      # minutes clears the import's own bound (2h55m, perfbench importBudget)
      # plus the rest, and a hung import is named as one. 10x-fleet took 7m.
      - id: points
        run: echo 'points=[{"name":"10x-store","minutes":200},{"name":"10x-fleet","minutes":30}]' >> "$GITHUB_OUTPUT"

  # One leg per scale point, each on its own runner and disk, so neither waits
  # on the other and a failed fleet keeps the store's figures. Each leg's
  # artifact is its report (every command's figure), its limits, and
  # perfbench's exit code: 0 measured within every budget, 2 measured and
  # breached, anything else (or nothing) the leg did not finish measuring.
  scale:
    name: scale ${{ matrix.point.name }}
    needs: scale-points
    strategy:
      fail-fast: false
      matrix:
        point: ${{ fromJSON(needs.scale-points.outputs.points) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.point.minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Built, then run, as ci.yml's perf-budget is, so exit 2 survives.
      - name: The latency budget and the writer storm at ${{ matrix.point.name }}
        env:
          POINT: ${{ matrix.point.name }}
        run: |
          out="$RUNNER_TEMP/scale"
          mkdir -p "$out"
          go build -o "$RUNNER_TEMP/perfbench" ./tools/perfbench
          status=0
          "$RUNNER_TEMP/perfbench" --sizes "$POINT" --limits "$out/limits.jsonl" > "$out/report.txt" || status=$?
          echo "$status" > "$out/exit-code"
          cat "$out/report.txt"
          exit "$status"

      # always(): a leg cancelled at its timeout still uploads the limits it
      # reached before it was cut off.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: scale-${{ matrix.point.name }}
          path: ${{ runner.temp }}/scale/

  # The night's verdict, on every ref, so a dispatch on a branch runs it on
  # that run's real limits: the limits grouped one entry per key, every
  # failed writer of a storm under its one key, and whether the lane itself
  # broke, which is any scale point without an exit code of 0 or 2.
  scale-verdict:
    needs: [scale-points, scale]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      limits: ${{ steps.verdict.outputs.limits }}
      broken: ${{ steps.verdict.outputs.broken }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scale-*
          path: scale

      - id: verdict
        env:
          POINTS: ${{ needs.scale-points.outputs.points }}
        run: |
          set -euo pipefail
          broken=false
          for point in $(jq -er '.[].name' <<<"$POINTS"); do
            code=$(cat "scale/scale-$point/exit-code" 2>&1) || code="none ($code)"
            echo "$point: perfbench exit code $code"
            case "$code" in 0|2) ;; *) broken=true ;; esac
          done
          limits=$(find scale -name limits.jsonl -exec cat {} + | jq -sc 'group_by(.limit) | map({limit: .[0].limit, title: .[0].title, measured: (map(.measured) | join("\n"))})')
          jq -r '.[] | "LIMIT \(.limit): \(.title)\n\(.measured)\n"' <<<"$limits"
          echo "limits=$limits" >> "$GITHUB_OUTPUT"
          echo "broken=$broken" >> "$GITHUB_OUTPUT"

  # One ticket per limit, filed or extended through the one reporter. Serial,
  # because every one pushes the same store and a refused push costs a pull
  # and a retry. Skipped on a night with no limit, where an empty matrix
  # would fail the run on the night the design finally holds.
  report-scale-limit:
    needs: scale-verdict
    if: ${{ always() && needs.scale-verdict.result == 'success' && needs.scale-verdict.outputs.limits != '[]' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        limit: ${{ fromJSON(needs.scale-verdict.outputs.limits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: ${{ matrix.limit.limit }}
          title: ${{ matrix.limit.title }}
          token: ${{ github.token }}
          details: ${{ matrix.limit.measured }}
          body: |
            The nightly ten-times lane (perfbench at 10x-store and 10x-fleet) measured this limit broken. A red limit is the design reaching its limit, not a bad commit: answer it with work on the limit, never by raising a budget or an allowance. Each red night appends its measured value here. If this is the design's known slope rather than a regression, lower this ticket to normal priority and leave it open, so it keeps collecting each night's value and closes when the work on it turns the lane green.

  # The lane itself broke: a scale point that did not finish measuring (a tool
  # failure, a timeout, a cancelled leg), or a verdict that could not be read.
  report-scale:
    needs: [scale-points, scale, scale-verdict]
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.scale-verdict.result != 'success' || needs.scale-verdict.outputs.broken == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: nightly-scale-failure
          title: Nightly ten-times lane did not finish measuring
          token: ${{ github.token }}
          body: |
            A scale point of the nightly ten-times lane (perfbench --sizes 10x-store / 10x-fleet) did not finish measuring: perfbench failed as a tool, its leg timed out or was cancelled, or the verdict could not be read. The run log names which. Any limit it reached before it stopped is filed under its own key. This is the instrument broken, not a limit: fix it so the lane measures again.

  # Windows is a release target, and this is the one lane that executes it.
  # The store's filesystem primitives - lock share modes, renaming over an open
  # handle, hard links, unlinking while open - behave differently there, and no
  # Linux run can show it. It runs nightly, not in ci.yml: the PR gate stays
  # Linux-only and fast, and a Windows-only regression turns this lane red the
  # night after it merges.
  #
  # Scope is the shipped binary and its libraries, the race lane's boundary in
  # ci.yml, plus the vendored driver module they build with, and -short for
  # the same reason: the scale tests add volume, not platform coverage.
  # -timeout 30m, as the full suite has: internal/cli alone runs past go test's
  # 10-minute per-package default here (run 39496042580). The job runs about
  # 46 minutes (run 39511640688), so it outlasts one package that hangs to its
  # 30-minute timeout and prints that hang's goroutine dump.
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # cgo needs a C/C++ toolchain and ICU (go-icu-regex). MSYS2's UCRT64
      # environment provides both; path-type inherit keeps setup-go's Go on
      # PATH, and ICU's DLLs sit on that PATH when the test binaries load.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-icu

      - uses: ./.github/actions/install-claude

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./cmd/lit

      # Every test runs except the known failures in
      # .github/windows-known-failures.txt, each owned by a child of epic
      # links-windows-qr8l, so the lane is green and a red run is a new
      # Windows failure, not one already filed. [LAW:one-source-of-truth]
      # go test's -skip is not scoped to a package, so a package with listed
      # tests gets its own invocation and a same-named test elsewhere still
      # runs. Every invocation runs even after one fails, so one red package
      # cannot hide another. [LAW:no-silent-failure] A line naming a test or a
      # package that does not exist fails the step, so the list cannot outlive
      # the code it describes and the notice counts tests that exist. -v puts
      # each test's verdict in the log: a test whose fault this platform does
      # not enforce skips itself saying why, and only -v shows that it did.
      - name: Test (-short)
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          known=.github/windows-known-failures.txt
          module=$(go list -m)
          pkgs=$(go list ./cmd/... ./internal/...)
          declare -A skip=() untested=()
          skipped=0
          while read -r ticket pkg test; do
            case "$ticket" in ''|'#'*) continue ;; esac
            case "$test" in
              '*')    untested[$pkg]=$ticket ;;
              Test*)  skip[$pkg]+="${skip[$pkg]:+|}$test"; skipped=$((skipped + 1)) ;;
              *) echo "::error file=$known::'$ticket $pkg $test' names no test: the third field is a top-level test or *" >&2; exit 1 ;;
            esac
          done < "$known"
          status=0
          rest=()
          declare -A seen=()
          for pkg in $pkgs; do
            rel=${pkg#"$module"/}
            seen[$rel]=1
            if [[ -v untested[$rel] ]]; then
              continue
            elif [[ -v skip[$rel] ]]; then
              re="^(${skip[$rel]})\$"
              found=$(go test -list "$re" "./$rel") || { status=1; continue; }
              missing=$(comm -23 <(tr '|' '\n' <<<"${skip[$rel]}" | sort) <(awk '/^Test/' <<<"$found" | sort))
              if [[ -n $missing ]]; then
                echo "::error file=$known::$rel has no test named" $missing "- delete its line" >&2
                status=1
              fi
              go test -v -short -timeout 30m -skip "$re" "./$rel" || status=1
            else
              rest+=("./$rel")
            fi
          done
          for listed in "${!skip[@]}" "${!untested[@]}"; do
            [[ -v seen[$listed] ]] || { echo "::error file=$known::no package $listed under ./cmd/... ./internal/... - delete its lines" >&2; status=1; }
          done
          go test -v -short -timeout 30m "${rest[@]}" || status=1
          echo "::notice file=$known,title=Known Windows failures::skipped $skipped tests in ${#skip[@]} packages; did not compile or run ${!untested[*]}"
          exit "$status"

      # internal/vendor/dolthub-driver is its own Go module, so ./internal/...
      # never reaches it; ci.yml tests it in a step of its own for the same
      # reason. It carries lit's patches to the driver, and its DSN and
      # directory handling has Windows-specific cases.
      - name: Test vendored driver (-short)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: '1'
        run: go -C internal/vendor/dolthub-driver test -short ./...

  # Each lane reports in its own job, so no suite runs holding the write token
  # a report needs. Each lane has its own alarm label too: one lane's open
  # ticket must not absorb the other lane's red runs as "Red again" comments,
  # or a Linux regression would hide behind a Windows red that is already
  # known. `result != 'success'` covers failure, cancellation, and the
  # job-level timeout, which GitHub reports as cancelled. [LAW:no-silent-failure]
  # Only master's runs report: the backlog is master's, and a run dispatched
  # on a branch is red in front of the session that dispatched it.
  report:
    needs: full-suite
    if: ${{ always() && needs.full-suite.result != 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: nightly-failure
          title: Nightly full test lane is failing
          token: ${{ github.token }}
          body: |
            A step in the nightly full-suite job failed, or the job was cancelled (a job that hits its 60-minute timeout also reports cancelled); the run log names which step and why. This lane runs everything the PR gate's `-short` skips, the law-token upstream check, and perfbench at the design size (the size ceiling's input allowances, latency and the writer storm at that size): triage it, do not mute it.

  report-windows:
    needs: windows
    if: ${{ always() && needs.windows.result != 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-to-lit
        with:
          label: nightly-windows-failure
          title: Nightly Windows test lane is failing
          token: ${{ github.token }}
          body: |
            A step in the nightly windows job failed, or the job was cancelled (a job that hits its 60-minute timeout also reports cancelled); the run log names which step and why. This lane is the only place lit's tests run on Windows, a release target, so a failure here is a Windows-only regression no other lane can show: triage it, do not mute it.
