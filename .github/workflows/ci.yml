name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here gates merge and must stay fast — <5 min total is the target,
# and build-and-test is the current outlier the testperf epic
# (links-testperf-xxsx) is driving down to it. CI runs on
# Linux only by deliberate choice — no macOS runners, no build matrix. The
# embedded Dolt engine builds with cgo (ICU/zstd); covering a second OS would
# slow the gate and add platform-provisioning machinery for little signal, so
# the one supported CI platform is ubuntu.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-dolt

      - name: Build
        run: go build ./cmd/lit

      # The inner loop: `-short` skips the tests that exist to exercise
      # deliberately generated scale (see nightly.yml for the lane that runs
      # them). Do not add a -timeout here to absorb slowness — a raised timeout
      # is the alarm being switched off, and slow inner-loop tests are bugs.
      # The alarm that IS wired in: tools/testbudget consumes this run's -json
      # stream and fails the build when a package exceeds its wall-clock budget
      # (tools/testbudget/budgets.go), naming the package and the overage.
      # `shell: bash` is load-bearing — it enables pipefail, so go test's own
      # exit code still fails the step through the pipe. [LAW:no-silent-failure]
      - name: Test
        shell: bash
        run: go test -short -json ./... | go run ./tools/testbudget

  # Repo/release hygiene gates — fast, platform-independent, ubuntu-only. These
  # check correctness properties of the repo, not the build, so they live apart
  # from build-and-test ([LAW:decomposition]) and run in parallel with it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Enforce module-file tidiness BEFORE a release tag can be cut. The
      # release pipeline (.goreleaser.yml) no longer runs `go mod tidy` as a
      # before-hook because that would mutate go.mod/go.sum at release time,
      # divorcing the published artifacts from the tagged commit.
      # [LAW:single-enforcer] this is the one place tidiness is checked.
      - name: go mod tidy check
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' locally and commit the diff above." >&2
            exit 1
          fi

      - name: Verify install disables VCS stamping
        run: grep -q -- "-buildvcs=false" scripts/install.sh

      - name: Install lit via repo script
        run: bash scripts/install.sh

  # golangci-lint enforces the depguard lifecycle-boundary rule (.golangci.yml).
  # The lint version is pinned so the gate is deterministic — a new linter
  # release can't fail an unrelated PR. Keep it matched to the version
  # developers run locally.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0

  # Gate docs the same way .8 verified them locally: a missing page or a link
  # outside docs_dir fails the build under --strict, so nav regressions can't
  # land silently. Versions pinned for a deterministic gate (mkdocs-material 2.0
  # is a breaking release).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6

      - name: mkdocs build --strict
        run: mkdocs build --strict
