name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here gates merge and must stay fast — <5 min total is the target,
# and two jobs are over it: build-and-test at 4m52s, which the testperf epic
# (links-testperf-xxsx) is driving down, and race at 7m40s (both measured
# 2026-08-26), which sets the gate's critical path. The race lane's overage is
# instrumentation, not slow tests — the detector multiplies whatever the tests
# already cost — so it has no fix of its own: its floor comes down when the same
# epic brings internal/cli's down, and it is the one job here whose number is
# not an invitation to go optimize this file. CI runs on
# Linux only by deliberate choice — no macOS runners, no build matrix. The
# embedded Dolt engine builds with cgo (ICU/zstd); covering a second OS would
# slow the gate and add platform-provisioning machinery for little signal, so
# the one supported CI platform is ubuntu.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-dolt

      - name: Build
        run: go build ./cmd/lit

      # The inner loop: `-short` skips the tests that exist to exercise
      # deliberately generated scale (see nightly.yml for the lane that runs
      # them). Do not add a -timeout here to absorb slowness — a raised timeout
      # is the alarm being switched off, and slow inner-loop tests are bugs.
      # The alarm that IS wired in: tools/testbudget consumes this run's -json
      # stream and fails the build when a package exceeds its wall-clock budget
      # (tools/testbudget/budgets.go), naming the package and the overage.
      # `shell: bash` is load-bearing — it enables pipefail, so go test's own
      # exit code still fails the step through the pipe. [LAW:no-silent-failure]
      - name: Test
        shell: bash
        run: go test -short -json ./... | go run ./tools/testbudget

  # The race detector's own lane. "Do the tests pass, and fast enough?" and "are
  # there data races?" are two questions, so they are two jobs
  # ([LAW:decomposition]) running in parallel, not one flag added to the step
  # above. The split is load-bearing, not tidiness: -race is a runtime regime,
  # not a flag — it instruments every memory access, and measured on this suite
  # (2026-08-26) it took tools/licenses from 29s to 149s and internal/cli from
  # 117s to 242s. Folding it into build-and-test would force every number in
  # tools/testbudget/budgets.go up to race-inflated figures, and that file is a
  # map of exactly one territory: un-instrumented inner-loop wall clock
  # ([LAW:one-source-of-truth]). Re-baselining it to absorb the detector is the
  # same move the Test step's comment forbids for -timeout — the alarm switched
  # off, blind thereafter to the runtime regressions it exists to catch. A
  # failure here also names itself as a race instead of arriving as a generic
  # red test step.
  #
  # Scope is the shipped binary and its libraries, not ./... : tools/ holds
  # build-time repo tooling that never runs on a user's machine, and a race
  # there cannot reach anyone. That is a structural boundary, which absorbs new
  # packages on its own — deliberately not a curated list of "the concurrent
  # packages", which would be a map that drifts from the code it describes.
  # No testbudget pipe: this lane's wall clock is instrumentation cost, so
  # measuring it against the honest budgets would be measuring the wrong thing.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/install-dolt

      # -short for the same reason the gate uses it: the scale tests exercise
      # generated volume through the same code paths the ordinary tests already
      # cover, so under instrumentation they buy hours and no new race coverage.
      - name: Test with race detector
        run: go test -short -race ./cmd/... ./internal/...

  # Repo/release hygiene gates — fast, platform-independent, ubuntu-only. These
  # check correctness properties of the repo, not the build, so they live apart
  # from build-and-test ([LAW:decomposition]) and run in parallel with it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Enforce module-file tidiness BEFORE a release tag can be cut. The
      # release pipeline (.goreleaser.yml) no longer runs `go mod tidy` as a
      # before-hook because that would mutate go.mod/go.sum at release time,
      # divorcing the published artifacts from the tagged commit.
      # [LAW:single-enforcer] this is the one place tidiness is checked.
      - name: go mod tidy check
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' locally and commit the diff above." >&2
            exit 1
          fi

      - name: Verify install disables VCS stamping
        run: grep -q -- "-buildvcs=false" scripts/install.sh

      - name: Install lit via repo script
        run: bash scripts/install.sh

  # golangci-lint enforces the depguard lifecycle-boundary rule (.golangci.yml).
  # The lint version is pinned so the gate is deterministic — a new linter
  # release can't fail an unrelated PR. Keep it matched to the version
  # developers run locally.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0

  # Gate docs the same way .8 verified them locally: a missing page or a link
  # outside docs_dir fails the build under --strict, so nav regressions can't
  # land silently. Versions pinned for a deterministic gate (mkdocs-material 2.0
  # is a breaking release).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6

      - name: mkdocs build --strict
        run: mkdocs build --strict
