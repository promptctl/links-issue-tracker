version: "2"

# [LAW:single-enforcer] formatting is gated here rather than by a separate
# `gofmt -l` workflow step, so one configuration decides it for CI (the lint
# job) and for `just lint` alike. A second step would be a second rulebook to
# drift from this one, and only CI would ever run it.
#
# gofmt's output is toolchain-dependent, so the gate is only deterministic
# because both ends are pinned: ci.yml pins golangci-lint, and setup-go's
# go-version-file: go.mod pins the Go it formats with. An unpinned gate fails a
# PR for drift its author never wrote.
#
# Do not "simplify" this into a `gofmt -l .` step. A developer checkout carries
# nested git worktrees under .claude/worktrees/ holding other sessions'
# branches, and a bare walk reports their unformatted files too. golangci-lint
# skips hidden directories, so it sees only this tree. CI checks out clean, so
# that difference is invisible there and surfaces only locally, as noise nobody
# can act on.
formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # [LAW:single-enforcer] lifecycle internals are enforced at the model package boundary instead of by caller convention.
        lifecycle-boundary:
          list-mode: lax
          files:
            - "!**/internal/model/**"
          deny:
            - pkg: "github.com/promptctl/links-issue-tracker/internal/model/lifecycle"
              desc: "lifecycle internals are owned by internal/model; use model hydration and capability APIs"
        # [LAW:effects-at-boundaries] the statusline writer runs on every
        # command that records a fact and must never wait on another process,
        # so it takes plain paths and values and imports only the standard
        # library. An allow-list rather than a deny-list of internal/store,
        # internal/storage and the lock code: a new package that opens the store
        # is refused too, without anyone remembering to list it. atomicfile is
        # the one internal package admitted, and only because its own rule
        # below holds it to the standard library too. The rule is about what
        # the writer runs, so a test of it is not held to it.
        statusline-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/statusline/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/promptctl/links-issue-tracker/internal/atomicfile$
        # [LAW:one-way-deps] every package that replaces a file atomically
        # shares this one writer, the stdlib-only statusline writer included,
        # so it sits below all of them and imports only the standard library.
        atomicfile-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/atomicfile/**"
            - "!$test"
          allow:
            - $gostd
        # [LAW:one-way-deps] any package may add a fact to the invocation's
        # event, the store and the workspace code included, so the package that
        # holds the event sits below all of them and imports only the standard
        # library.
        telemetry-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/telemetry/**"
          allow:
            - $gostd
