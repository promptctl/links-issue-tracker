# Repository layer for `copirate-review` — the installer that converges the AI code review
# workflow and its secrets into this repository.
#
#   https://github.com/promptctl/copirate-code-review-agent
#
# This file declares ONLY what differs from the installer's shipped defaults; the machine
# layer (~/.config/copirate-review/config.yaml) supplies the credential, and everything
# not named here is inherited. Layers deep-merge, and a null deletes the key it names.
#
# WHY THIS FILE EXISTS AT ALL. Until now this repository's .github/workflows/code-review.yml
# was generated by the `agent-code-review-setup` skill in a different repository
# (brandon-fryslie/dotfiles), which made the workflow and the action it invokes two maps of
# one contract, free to disagree — and they did: that template triggers on `pull_request`
# with workflow-level `cancel-in-progress: true`, so a second push threw away the review
# already running. Measured on PR #557 on 2026-09-21: six pushes in 26 minutes, four reviews
# killed after spending their tokens and posting nothing. Ownership of this file moves here,
# beside the action it calls. [LAW:one-source-of-truth]
#
# The shipped base this now renders reviews ON REQUEST (comment `/review` on a pull request)
# rather than on every push, so a review is never racing the next commit.

workflows:
  .github/workflows/code-review.yml:
    inputs:
      # The shipped default list plus the ONE pattern this repository adds. Restated in full
      # because a scalar merges by replacement, not by append — the inherited value is
      # "dist/**,**/dist/**,build/**,**/build/**,*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml".
      #
      #   doc-v1-total/inventories/** — generated inventories, not authored material.
      #
      # The previous template also listed .github/workflows/code-review.yml here. That is
      # NOT restated, and its absence is not a loss: the installer prepends every workflow
      # path it generates to this list, so naming it again only rendered it twice.
      #
      # Preserved deliberately — this migration changes WHEN a review runs, and nothing
      # about what it may look at.
      EXCLUDE_PATTERNS: "dist/**,**/dist/**,build/**,**/build/**,*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml,doc-v1-total/inventories/**"
